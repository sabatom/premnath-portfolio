<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message Sent | Premnath Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #020617;
            color: #ffffff;
        }

        .thank-you-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(124, 58, 237, 0.18),
                    transparent 40%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(6, 182, 212, 0.10),
                    transparent 40%
                ),
                #020617;
        }

        .thank-you-box {
            width: 100%;
            max-width: 500px;

            padding: 50px 35px;

            text-align: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(124, 58, 237, 0.12),
                    rgba(6, 182, 212, 0.05)
                );

            border: 1px solid rgba(168, 85, 247, 0.4);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .thank-you-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 38px;
            font-weight: bold;

            color: #06d9ff;

            background: rgba(6, 182, 212, 0.10);

            border: 2px solid #06b6d4;
        }

        .thank-you-box h1 {
            font-size: 34px;
            margin-bottom: 15px;
        }

        .thank-you-box h1 span {
            background: linear-gradient(
                90deg,
                #a855f7,
                #3b82f6,
                #06b6d4
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .thank-you-box p {
            color: #94a3b8;

            font-size: 16px;
            line-height: 1.7;

            margin-bottom: 30px;
        }

        .back-home {
            display: inline-block;

            padding: 13px 28px;

            border-radius: 25px;

            text-decoration: none;

            color: #ffffff;

            font-size: 14px;
            font-weight: 600;

            background:
                linear-gradient(
                    90deg,
                    #7c3aed,
                    #06b6d4
                );

            transition: 0.3s;
        }

        .back-home:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 30px rgba(6, 182, 212, 0.25);
        }

        @media (max-width: 600px) {

            .thank-you-page {
                padding: 20px;
            }

            .thank-you-box {
                padding: 40px 25px;
            }

            .thank-you-icon {
                width: 65px;
                height: 65px;
                font-size: 32px;
            }

            .thank-you-box h1 {
                font-size: 28px;
            }

            .thank-you-box p {
                font-size: 14px;
            }
        }
    </style>

</head>

<body>

    <section class="thank-you-page">

        <div class="thank-you-box">

            <div class="thank-you-icon">
                ✓
            </div>

            <h1>
                Message <span>Sent!</span>
            </h1>

            <p>
                Thank you for contacting me.
                Your message has been received successfully.
                I will get back to you soon.
            </p>

            <a href="index.html" class="back-home">
                ← Back to Portfolio
            </a>

        </div>

    </section>

</body>

</html>
